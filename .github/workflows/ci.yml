name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} — validate and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, fileinfo, json, mbstring, pdo, pdo_sqlite
          coverage: none

      - name: Validate Composer files
        run: composer validate --strict --no-check-version

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit dependencies
        run: composer audit --no-interaction

      - name: Static analysis
        run: composer analyse

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  docker-operations:
    name: Production Docker operations
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build --load -t formflow-test .

      - name: Verify delivery monitoring and backup restoration
        run: python3 tests/Smoke/docker_operations.py --image=formflow-test
