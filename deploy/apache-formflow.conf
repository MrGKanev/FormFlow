<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    <Directory /var/www/html/storage>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/formflow-error.log
    CustomLog ${APACHE_LOG_DIR}/formflow-access.log combined
</VirtualHost>
